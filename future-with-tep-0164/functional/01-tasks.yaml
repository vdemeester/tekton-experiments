# Functional TEP-0164 tasks — works against the tep-0164-artifact-transport branch.
# Apply with: kubectl apply -f 01-tasks.yaml
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
    - name: revision
      default: main
  results:
    - name: commit
  artifacts:
    outputs:
      - name: source
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        set -ex
        mkdir -p $(outputs.source.path)
        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" $(outputs.source.path)
        cd $(outputs.source.path)
        git rev-parse HEAD | tr -d '\n' > $(results.commit.path)
        echo "Cloned $(params.url) at $(cat $(results.commit.path))"
        # ← No oras push. Entrypoint uploads $(outputs.source.path) to OCI registry.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-tests
spec:
  params:
    - name: packages
      default: "./..."
    - name: go-version
      default: "1.26"
  results:
    - name: tests-passed
    - name: coverage-pct
  artifacts:
    inputs:
      - name: source
    outputs:
      - name: test-results
        mediaType: application/vnd.tekton.artifact.junit.v1+xml
      - name: coverage
        mediaType: application/vnd.tekton.artifact.coverage.v1
  steps:
    - name: test
      image: docker.io/library/golang:$(params.go-version)
      script: |
        #!/bin/bash
        set -x
        cd $(inputs.source.path)

        go install gotest.tools/gotestsum@latest

        mkdir -p $(outputs.test-results.path)
        mkdir -p $(outputs.coverage.path)

        PASSED=true
        gotestsum \
          --junitfile $(outputs.test-results.path)/junit-results.xml \
          --format testdox \
          -- \
          -coverprofile=$(outputs.coverage.path)/coverage.out \
          -covermode=atomic \
          -count=1 \
          $(params.packages) || PASSED=false

        if [ -f $(outputs.coverage.path)/coverage.out ]; then
          COV=$(go tool cover -func=$(outputs.coverage.path)/coverage.out | tail -1 | awk '{print $3}')
          echo -n "${COV}" > $(results.coverage-pct.path)
        else
          echo -n "0%" > $(results.coverage-pct.path)
        fi

        echo -n "${PASSED}" > $(results.tests-passed.path)
        [ "${PASSED}" = "true" ] || exit 1
        # ← No oras push. No export step. Entrypoint handles both outputs.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
spec:
  params:
    - name: image-registry
    - name: image-tag
      default: latest
  results:
    - name: image-ref
  artifacts:
    inputs:
      - name: source
    outputs:
      - name: images
        buildOutput: true
        mediaType: application/vnd.tekton.artifact.images.v1+json
  steps:
    - name: build
      image: ghcr.io/ko-build/ko:latest
      env:
        - name: KO_DOCKER_REPO
          value: $(params.image-registry)
      script: |
        #!/bin/sh
        set -ex
        cd $(inputs.source.path)

        IMAGE_REF=$(ko build ./ --platform=linux/amd64 -t "$(params.image-tag)" --bare --insecure-registry)
        echo -n "${IMAGE_REF}" > $(results.image-ref.path)

        mkdir -p $(outputs.images.path)
        DIGEST=$(echo "${IMAGE_REF}" | cut -d@ -f2)
        cat > $(outputs.images.path)/images-manifest.json <<IEOF
        {"images": [{"uri": "${IMAGE_REF}", "digest": "${DIGEST}"}]}
        IEOF

        echo "Built: ${IMAGE_REF}"
        # ← No oras push. Entrypoint uploads artifact + Chains treats as SLSA subject.
